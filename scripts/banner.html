<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
</style>
</head>
<body>
<div style="width:1200px;height:630px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0b1020 0%,#131a33 55%,#0d1226 100%);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f1f5f9;display:flex;flex-direction:column;">
  <div style="position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#ef444455 0%,transparent 70%);filter:blur(40px);top:-220px;right:-140px;"></div>
  <div style="position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#ec489955 0%,transparent 70%);filter:blur(40px);bottom:-260px;left:-160px;"></div>

  <div style="position:relative;flex:1;display:flex;flex-direction:column;padding:48px 64px 40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:16px;">
        <img src="../public/assets/android-chrome-192x192.png" width="56" height="56" style="border-radius:14px;display:block;">
        <span style="font-size:26px;font-weight:700;letter-spacing:0.18em;">UNITRACKER</span>
      </div>
      <div style="font-size:20px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:10px 22px;border-radius:999px;color:#0b1020;background:linear-gradient(90deg,#ef4444,#ec4899);">
        Unstoppable
      </div>
    </div>

    <div style="flex:1;display:flex;align-items:center;gap:48px;">
      <div style="flex:1;">
        <div style="display:flex;align-items:baseline;gap:24px;">
          <span style="font-size:190px;font-weight:800;line-height:1;color:#ef4444;">21</span>
          <span style="font-size:44px;font-weight:600;color:#cbd5e1;">days</span>
        </div>
        <div style="font-size:34px;font-weight:600;color:#e2e8f0;margin-top:4px;">study streak</div>
        <div style="font-size:24px;color:#94a3b8;margin-top:22px;">68h 30m focused · 21-day best</div>
      </div>

      <div style="width:300px;height:300px;border-radius:50%;padding:10px;background:linear-gradient(135deg,#ef4444,#ec4899);flex-shrink:0;">
        <div style="width:100%;height:100%;border-radius:50%;background:#0d1226;display:flex;align-items:center;justify-content:center;">
          <svg width="150" height="150" viewBox="0 0 24 24" fill="#ec4899" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        </div>
      </div>
    </div>

    <div style="border-top:1px solid rgba(148,163,184,0.25);padding-top:24px;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:26px;font-weight:600;color:#e2e8f0;">Track your study streak free</span>
      <span style="font-size:26px;font-weight:800;color:#ef4444;">unitracker.me</span>
    </div>
  </div>
</div>
</body>
</html>
